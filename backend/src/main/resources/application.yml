spring:
  application:
    name: shreeji-art-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    hikari:
      # Disable PostgreSQL server-side prepared statements.
      # Required when connecting through Supabase transaction pooler
      # (PgBouncer, port 6543). PgBouncer rotates the underlying
      # PostgreSQL connection between transactions, so a prepared
      # statement named S_1 on connection A is invisible on connection B.
      # prepareThreshold=0 forces the simple query protocol for all
      # statements, which is fully compatible with transaction pooling.
      data-source-properties:
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_UPLOAD_SIZE:15MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:20MB}

server:
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  allowed-origins: ${ALLOWED_ORIGINS}

admin:
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

media:
  storage:
    supabase-url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    project-bucket: ${SUPABASE_PROJECT_IMAGES_BUCKET:project-images}
    gallery-bucket: ${SUPABASE_GALLERY_IMAGES_BUCKET:gallery-images}
    max-upload-bytes: ${MEDIA_MAX_UPLOAD_BYTES:15728640}
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/avif
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
